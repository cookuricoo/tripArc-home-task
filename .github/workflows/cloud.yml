name: Sauce Labs native apps
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform
        type: choice
        options: [android, ios]
        required: true
      device:
        description: Real device display name or regex from the Sauce Labs device list
        type: string
        required: true
      os:
        description: OS version from the Sauce Labs device list
        type: string
        required: true
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM: ${{ inputs.platform }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCE_ANDROID_DEVICE: ${{ inputs.device }}
      SAUCE_IOS_DEVICE: ${{ inputs.device }}
      SAUCE_ANDROID_OS: ${{ inputs.os }}
      SAUCE_IOS_OS: ${{ inputs.os }}
      BUILD_NAME: triparc-${{ github.run_id }}-${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run apps:download -- "$PLATFORM"
      - run: npm run cloud:upload -- "$PLATFORM"
      - run: npm run "test:cloud:$PLATFORM"
      - name: Build Allure report
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-${{ inputs.platform }}-results
          path: artifacts/
          retention-days: 7
